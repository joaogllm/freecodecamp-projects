<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="./theme-switcher.css" />
  </head>
  <body>
    <div>
      <button
        id="theme-switcher-button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="theme-dropdown"
      >
        Switch Theme
      </button>
      <ul
        id="theme-dropdown"
        role="menu"
        aria-labelledby="theme-switcher-button"
        hidden
      >
        <li role="menuitem" id="theme-light">Light</li>
        <li role="menuitem" id="theme-dark">Dark</li>
        <li role="menuitem" id="theme-orange">Orange</li>
      </ul>
      <div aria-live="polite"></div>
    </div>
    <script src="./theme-switcher.js"></script>
  </body>
</html>
