<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="./palindrome-checker.css" />
  </head>

  <body>
    <header class="main-text">
      <h1 class="title">Is it a Palindrome?</h1>
      <p class="description">Enter in text to check for a palindrome</p>
    </header>
    <main>
      <div><input
        placeholder="Enter text here"
        id="text-input"
      ></input>
      <button class="btn" id="check-btn" type="button">Check message</button>
      <p id="result"></p></div>
      <div class="palindrome-container">
        <p id="palindrome-desc">💡 A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
      </div>
    </main>
    <footer class="footer">&copy; Palindromet</footer>
    <script src="./palindrome-checker.js"></script>
  </body>
</html>
